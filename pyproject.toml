[project]
name = "garage"
authors = [{ name = "Cloudtrade", email = "webshippa@gmail.com" }]
description = "Garage / workshop management for ERPNext: gate check-in, damage map, job cards, gate pass"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
